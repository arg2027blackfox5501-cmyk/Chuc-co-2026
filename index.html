    <!-- Giao diện màn hình lỗi hệ thống giả lập -->
    <div class="notice">
        <h1>ERR_CONNECTION_REFUSED_502</h1>
        <p>Hệ thống yêu cầu xác thực bảo mật văn học. Vui lòng mở bảng điều khiển <b>DevTools (F12)</b> để trả lời câu hỏi.</p>
    </div>

    <script>
        // --- HÀM HỖ TRỢ XÓA DẤU TIẾNG VIỆT (Giúp web nhận diện linh hoạt dù gõ có dấu hay không dấu) ---
        function removeAccents(str) {
            return str.normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .replace(/đ/g, 'd').replace(/Đ/g, 'D');
        }

        // --- IN SẴN HƯỚNG DẪN VÀO CONSOLE ---
        console.clear();
        console.log("%c[SYSTEM KERNEL]: Phát hiện hệ thống bị khóa bởi lớp bảo mật 7A6.", "color: #ff4b2b; font-size: 14px; font-weight: bold;");
        console.log("%c[CÂU HỎI 1]: Thế thơ bốn chữ và thể thơ năm chữ nhận dạng dựa vào cái gì?", "color: #00ffcc; font-size: 13px; font-weight: bold;");
        console.log("%c   Cách trả lời: Nhập lệnh -> check1('số chữ')", "color: #ffff00; font-size: 13px; background: #111; padding: 4px; border-radius: 4px;");

        // Biến kiểm tra trạng thái vượt qua câu 1
        let passedQ1 = false;

        // 1. Hàm kiểm tra câu hỏi 1 (Linh hoạt nhiều cách hiểu/viết)
        window.check1 = function(answer) {
            let cleanText = removeAccents(answer.toLowerCase().trim());
            
            // Danh sách các từ khóa hệ thống chấp nhận cho Câu 1
            let acceptedKeywords = ["chu", "tieng", "so chu", "so tieng", "so luong chu", "so luong tieng", "do dai"];
            
            let isCorrect = acceptedKeywords.some(keyword => cleanText.includes(keyword));

            if(isCorrect) {
                passedQ1 = true;
                console.clear();
                console.log("%c[CHÍNH XÁC!] Câu 1 đã vượt qua.", "color: #2ed573; font-size: 15px; font-weight: bold;");
                console.log("%c[CÂU HỎI 2]: Tác giả của bài học 'Vừa nhắm mắt vừa mở cửa sổ' là ai?", "color: #00ffcc; font-size: 14px; font-weight: bold;");
                console.log("%c   Cách trả lời: Nhập lệnh -> check2('tên tác giả')", "color: #ffff00; font-size: 13px; background: #111; padding: 4px; border-radius: 4px;");
                return "Câu 1 đúng! Hãy tiến hành trả lời Câu 2.";
            } else {
                console.log("%c[SAI RỒI]: Hãy nhớ lại xem thể thơ 4, 5 chữ gọi tên theo cái gì nhé!", "color: #ff4b2b; font-size: 14px;");
                return "Thử lại câu 1 đi cô ơi!";
            }
        };

        // 2. Hàm kiểm tra câu hỏi 2 (Đã nạp sẵn tên tác giả và các biến thể viết không dấu)
        window.check2 = function(author) {
            if (!passedQ1) {
                console.log("%c[CẢNH BÁO]: Cô chưa trả lời xong Câu 1 kìa!", "color: #ff4b2b; font-size: 14px;");
                return "Vui lòng hoàn thành Câu 1 trước bằng lệnh check1(...)";
            }

            let cleanAuthor = removeAccents(author.toLowerCase().trim());

            // Danh sách các cách viết có thể xảy ra của tên tác giả (Có dấu, không dấu, viết tắt, v.v.)
            let validAuthors = [
                "nguyen ngoc thuan", 
                "ngoc thuan", 
                "n ngoc thuan", 
                "n. ngoc thuan",
                "nguyễn ngọc thuần", 
                "ngọc thuần"
            ];

            let isAuthorCorrect = validAuthors.some(name => cleanAuthor.includes(name));

            if (isAuthorCorrect) {
                let targetURL = "https://arg2027blackfox5501-cmyk.github.io/tui-mu/"; // Đường dẫn trang 3 của cậu
                console.clear();
                console.log("%c🎉 XUẤT SẮC! ĐÃ VƯỢT QUA MỌI THỬ THÁCH!", "color: #00ffcc; font-size: 16px; font-weight: bold;");
                console.log("%c[ĐANG CHUYỂN HƯỚNG]: Đang đưa cô sang trang nhận quà...", "color: #ffff00; font-size: 14px;");
                
                alert("Giải mã thành công! Web chuẩn bị chuyển sang trang quà tặng cuối cùng.");
                
                // Tự động chuyển hướng sang website thứ 3 sau 1 giây
                setTimeout(function() {
                    window.location.href = targetURL;
                }, 1000);

                return "Access Granted: " + targetURL;
            } else {
                console.log("%c[SAI TÁC GIẢ]: Gợi ý là nhà văn Nguyễn... chuyên viết truyện cho thiếu nhi!", "color: #ff4b2b; font-size: 14px;");
                return "Sai tên tác giả rồi, thử lại nhé!";
            }
        <!-- === ĐOẠN CODE HỖ TRỢ GÕ DẤU GẠCH CHÉO TRÊN ĐIỆN THOẠI === -->
<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; text-align: center; width: 90%;">
    <input type="text" id="mobileSlashInput" placeholder="Chạm vào đây, gõ dấu / rồi bấm Enter..." style="width: 100%; padding: 12px; font-size: 16px; background: #111; color: #00ffcc; border: 1px dashed #555; border-radius: 8px; text-align: center; outline: none;">
</div>

<script>
    // Tự động focus vào ô nhập liệu ngay khi mở trang để bật bàn phím ảo trên điện thoại
    window.onload = function() {
        let inputField = document.getElementById('mobileSlashInput');
        inputField.focus();
        
        // Bắt sự kiện khi gõ phím hoặc bấm Enter
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' || inputField.value.includes('/')) {
                // Đường dẫn sang Trang thứ hai của cậu
                window.location.href = "URL_GALAXY_HOẶC_PAGES_CỦA_TRANG_2"; 
            }
        });
        
        // Dự phòng cho một số trình duyệt chặn tự động focus: chạm bất kỳ đâu trên màn hình là hiện bàn phím
        document.body.addEventListener('click', function() {
            inputField.focus();
        });
    };
</script>
